name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The rule CONTRIBUTING.md makes non-negotiable, enforced on every PR.
  sanitization:
    name: No real workplace data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No real workplace data in the repo
        run: ./tools/check-clean.sh
      - name: The checker still detects known leak classes
        run: ./tools/check-clean-selftest.sh

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.9' }

      - name: Compile bundled scripts
        run: python -m py_compile skills/chief-of-staff/scripts/*.py

      - name: State ledger works
        run: python skills/chief-of-staff/scripts/proactive_state.py status

      # The ledger imported fcntl unconditionally and died at import on Windows,
      # before argparse — so every subcommand failed, not just the locking ones.
      - name: State ledger runs without a locking primitive
        run: |
          d=$(mktemp -d)
          cp skills/chief-of-staff/scripts/proactive_state.py "$d/ps.py"
          # Block ONLY fcntl. msvcrt is genuinely absent on Linux and macOS, so
          # this reaches the final no-locking fallback on its own.
          #
          # It must raise ModuleNotFoundError, not a bare ImportError: the stdlib
          # catches the former. A bare ImportError escapes unrelated defensive
          # handlers — shadowing msvcrt this way broke subprocess, which uuid
          # imports transitively, and the ledger died for a reason that had
          # nothing to do with locking.
          printf 'raise ModuleNotFoundError("No module named fcntl")\n' > "$d/fcntl.py"
          ( cd "$d" && python ps.py status ) \
            || { echo "::error::ledger dies without a locking primitive"; exit 1; }
          echo "ledger degrades correctly with no file locking"

      - name: Queue drain must not acknowledge before rendering
        run: |
          d=$(mktemp -d)
          cp skills/chief-of-staff/scripts/proactive_state.py "$d/ps.py"
          cd "$d" && mkdir -p state
          python ps.py queue-add --json '{"id":"mail:crit","title":"VP escalation"}' >/dev/null
          b=$(python ps.py queue-drain --format json 2>&1 >/dev/null | sed 's/^batch \([a-f0-9]*\).*/\1/')
          n=$(python ps.py queue-drain --format json | python -c 'import json,sys;print(len(json.load(sys.stdin)))')
          [ "$n" = "1" ] || { echo "::error::failed brief lost queued items ($n)"; exit 1; }
          # A bare ack must be refused: it would retire another run's items.
          if python ps.py queue-ack >/dev/null 2>&1; then
            echo "::error::bare queue-ack was accepted"; exit 1
          fi
          # Acking a stale batch must retire nothing.
          python ps.py queue-ack --batch "$b" >/dev/null 2>&1 || true
          n=$(python ps.py queue-drain --format json | python -c 'import json,sys;print(len(json.load(sys.stdin)))')
          [ "$n" = "1" ] || { echo "::error::stale batch ack retired items it did not drain ($n)"; exit 1; }
          python ps.py queue-ack --all >/dev/null
          n=$(python ps.py queue-drain --format json | python -c 'import json,sys;print(len(json.load(sys.stdin)))')
          [ "$n" = "0" ] || { echo "::error::ack did not retire in-flight items ($n)"; exit 1; }
          echo "drain/ack ordering and batch scoping correct"

      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n tools/check-clean.sh
          bash -n tools/margo-scheduled.sh
          bash -n tools/gen-automations-docs.sh
          bash -n packaging/macos/build-pkg.sh
          bash -n packaging/macos/scripts/postinstall

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          ignore_paths: build dist

      # The wrapper exists so the write-denials cannot be trimmed by hand. If it
      # ever stops emitting all four, unattended runs silently regain the ability
      # to send mail.
      - name: Scheduled wrapper denies every Work IQ write tool
        run: |
          out=$(./tools/margo-scheduled.sh brief --print)
          for t in do_action create_entity update_entity delete_entity; do
            printf '%s' "$out" | grep -q -- "--deny-tool workiq($t)" \
              || { echo "::error::wrapper does not deny workiq($t)"; exit 1; }
          done
          # An explicit allow must not survive: denial takes precedence.
          out=$(./tools/margo-scheduled.sh brief --print --allow-tool 'workiq(do_action)')
          printf '%s' "$out" | grep -q -- '--deny-tool workiq(do_action)' \
            || { echo "::error::pass-through args removed a denial"; exit 1; }
          echo "wrapper denies all four write tools"

      # The deny list covers Work IQ writes. The one rule the CLI cannot enforce
      # — never ask a question nobody is there to answer — lives in the prompt,
      # and the wrapper used to send "Run my morning brief." instead: a run that
      # could legally end in ask_user and hang until timeout, at 06:00.
      - name: Every scheduled prompt carries the unattended contract
        run: |
          set -euo pipefail
          verbs=$(./tools/margo-scheduled.sh list 2>/dev/null | awk 'NR>1 && NF {print $1}')
          # An exact count, not just "non-empty". The old guard could not tell
          # five automations from six, so a dropped one looked like success.
          n=$(printf '%s\n' "$verbs" | grep -c .)
          expected=$(find automations -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          [ "$n" = "$expected" ] \
            || { echo "::error::list reported $n verbs, but $expected automations exist"; exit 1; }
          for v in $verbs; do
            p=$(./tools/margo-scheduled.sh "$v" --show-prompt)
            printf '%s' "$p" | grep -qi 'unattended' \
              || { echo "::error::$v prompt never says it is unattended"; exit 1; }
            printf '%s' "$p" | grep -qi 'ask_user' \
              || { echo "::error::$v prompt does not ban ask_user"; exit 1; }
            echo "  ok: $v"
          done
          # A free-form prompt is unattended too — it goes through the same cron.
          ./tools/margo-scheduled.sh "what did I miss" --show-prompt \
            | grep -qi 'unattended' \
            || { echo "::error::free-form prompt loses the contract"; exit 1; }
          echo "every prompt states the contract"

      - name: The automations table in the docs is current
        run: ./tools/gen-automations-docs.sh --check

      # Every one of these fixtures shipped a silently-wrong prompt before the
      # wrapper learned to fail closed. "Unknown verb" and "this verb's manifest
      # did not resolve" used to be the same state, so a broken automation ran
      # with its own name as the entire prompt at 06:00.
      - name: A broken automation fails loudly, never as a bare-word prompt
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/fx"; rm -rf "$base"

          # $1 = fixture name. Fails unless the wrapper exits non-zero AND never
          # emits the bare verb as the prompt.
          must_fail() {
            d="$base/$1"
            if out=$(MARGO_AUTOMATIONS="$d" ./tools/margo-scheduled.sh brief --show-prompt 2>&1); then
              echo "::error::$1: wrapper succeeded on a broken manifest"
              printf '%s\n' "$out" | head -3; exit 1
            fi
            if [ "$(printf '%s' "$out" | tail -1)" = "brief" ]; then
              echo "::error::$1: prompt degraded to the bare verb"; exit 1
            fi
            echo "  ok: $1 failed closed"
          }
          fresh() { rm -rf "$base/$1"; mkdir -p "$base/$1"; cp automations/*.md "$base/$1"/; }

          # README-only: the discovery guard used to certify this directory.
          mkdir -p "$base/readme-only" && cp automations/README.md "$base/readme-only/"
          must_fail readme-only

          fresh no-verb   && sed -i'' -e 's/^verb: .*//' "$base/no-verb/morning-brief.md"   && must_fail no-verb
          fresh dup-verb  && sed -i'' -e 's/^verb: .*/verb: brief/' "$base/dup-verb/eod-wrap-up.md" && must_fail dup-verb
          fresh reserved  && sed -i'' -e 's/^verb: brief/verb: crontab/' "$base/reserved/morning-brief.md" && must_fail reserved

          # An unknown bare word must error rather than become the prompt.
          if out=$(./tools/margo-scheduled.sh brie --show-prompt 2>&1); then
            echo "::error::unknown bare verb was accepted as a prompt"; exit 1
          fi
          echo "  ok: unknown bare verb rejected"

          # ...but an explicit free-form phrase, and --prompt, still work.
          ./tools/margo-scheduled.sh "what did I miss" --show-prompt | grep -qi unattended
          ./tools/margo-scheduled.sh brie --prompt --show-prompt | grep -qi unattended
          echo "  ok: free-form phrases and --prompt still work"

      # A BOM or a trailing space used to break the awk parsers while PowerShell
      # trimmed them away, so the same file ran two different prompts on two
      # machines. An inline comment — which the published template used — broke
      # the verb match in both.
      - name: BOM, delimiter whitespace and inline comments parse correctly
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/fm"; rm -rf "$base"
          want=$(./tools/margo-scheduled.sh brief --show-prompt)

          fresh() { rm -rf "$base/$1"; mkdir -p "$base/$1"; cp automations/*.md "$base/$1"/; }
          same() {
            got=$(MARGO_AUTOMATIONS="$base/$1" ./tools/margo-scheduled.sh brief --show-prompt)
            [ "$got" = "$want" ] || { echo "::error::$1 changed the prompt"; exit 1; }
            echo "  ok: $1"
          }

          fresh bom && printf '\xef\xbb\xbf' | cat - "$base/bom/morning-brief.md" > "$base/bom/tmp" \
            && mv "$base/bom/tmp" "$base/bom/morning-brief.md" && same bom
          fresh delim-ws && perl -0pi -e 's/\A---\n/--- \n/' "$base/delim-ws/morning-brief.md" && same delim-ws
          fresh comment && sed -i'' -e 's|^verb: brief|verb: brief   # the wrapper verb|' "$base/comment/morning-brief.md" && same comment
          echo "line endings, BOMs and comments do not change what gets sent"

      # A Windows clone without .gitattributes produced CRLF automations, and
      # the awk parsers compared against a bare "---". The shell wrapper then
      # failed to recognise 'brief' as a verb and sent the word "brief" as a
      # free-form prompt, while PowerShell ran the real automation — two
      # machines on the same schedule doing different things, silently.
      - name: CRLF automations parse identically
        run: |
          set -euo pipefail
          crlf="$RUNNER_TEMP/crlf-automations"
          rm -rf "$crlf"; mkdir -p "$crlf"
          for f in automations/*.md; do
            sed 's/$/\r/' "$f" > "$crlf/$(basename "$f")"
          done
          for v in $(MARGO_AUTOMATIONS="$crlf" ./tools/margo-scheduled.sh list 2>/dev/null | awk 'NR>1 && NF {print $1}'); do
            a=$(./tools/margo-scheduled.sh "$v" --show-prompt)
            b=$(MARGO_AUTOMATIONS="$crlf" ./tools/margo-scheduled.sh "$v" --show-prompt)
            [ "$a" = "$b" ] || { echo "::error::CRLF changed the prompt for $v"; exit 1; }
            echo "  ok: $v"
          done
          echo "line endings do not change what gets sent"

      - name: PowerShell syntax
        shell: pwsh
        run: |
          foreach ($f in @('install.ps1', 'packaging/windows/build-exe.ps1', 'tools/margo-scheduled.ps1')) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f).Path, [ref]$null, [ref]$errs)
            if ($errs.Count) {
              $errs | ForEach-Object {
                Write-Host "::error file=$f,line=$($_.Extent.StartLineNumber)::$($_.Message)"
              }
              exit 1
            }
            Write-Host "OK $f"
          }

      # The .ps1 was previously only syntax-parsed, so the Windows wrapper could
      # have lost a denial with CI staying green — the same guarantee as the
      # shell wrapper above, unenforced on the other half of the userbase.
      # Matched quote-insensitively: -Print quotes args containing parens, and
      # that is formatting rather than part of the contract being asserted.
      - name: Scheduled wrapper (PowerShell) denies every Work IQ write tool
        shell: pwsh
        run: |
          $out = (& ./tools/margo-scheduled.ps1 brief -Print) -join "`n"
          foreach ($t in @('do_action', 'create_entity', 'update_entity', 'delete_entity')) {
            if ($out -notmatch "--deny-tool '?workiq\($t\)'?") {
              Write-Host "::error::wrapper does not deny workiq($t)"
              exit 1
            }
          }
          # An explicit allow must not survive: denial takes precedence.
          $out = (& ./tools/margo-scheduled.ps1 brief -Print --allow-tool 'workiq(do_action)') -join "`n"
          if ($out -notmatch "--deny-tool '?workiq\(do_action\)'?") {
            Write-Host "::error::pass-through args removed a denial"
            exit 1
          }
          Write-Host "wrapper denies all four write tools"

      # Two wrappers reading one manifest is the whole point of automations/.
      # If they ever disagree about what a verb means, half the userbase is
      # running a prompt nobody reviewed — which is the drift this replaced.
      #
      # Compared WITHOUT .Trim(). Trimming both sides hid the very divergence
      # this step exists to catch: the shell parser kept a prompt's leading and
      # trailing spaces and PowerShell stripped them, and the guard said they
      # matched. A whitespace-boundary fixture is included for that reason.
      - name: Both wrappers send byte-identical prompts
        shell: pwsh
        run: |
          $verbs = (& ./tools/margo-scheduled.sh list 2>$null) |
                   Select-Object -Skip 1 |
                   ForEach-Object { ($_ -split '\s+')[0] } |
                   Where-Object { $_ }
          if (-not $verbs) { Write-Host "::error::no automations found"; exit 1 }

          function Compare-Verb($dir, $v) {
            if ($dir) { $env:MARGO_AUTOMATIONS = $dir } else { Remove-Item Env:MARGO_AUTOMATIONS -ErrorAction SilentlyContinue }
            $sh  = (& ./tools/margo-scheduled.sh $v --show-prompt) -join "`n"
            $ps1 = (& ./tools/margo-scheduled.ps1 $v -ShowPrompt) -join "`n"
            if ($sh -cne $ps1) {
              Write-Host "::error::wrappers disagree on '$v'$(if($dir){" in $dir"})"
              Write-Host "sh : $([System.Text.Encoding]::UTF8.GetBytes($sh)  -join ',')"
              Write-Host "ps1: $([System.Text.Encoding]::UTF8.GetBytes($ps1) -join ',')"
              exit 1
            }
            Write-Host "  ok: $v"
          }

          foreach ($v in $verbs) { Compare-Verb $null $v }

          # A prompt whose body starts indented and ends with trailing spaces.
          $fx = Join-Path $env:RUNNER_TEMP 'ws'
          Remove-Item -Recurse -Force $fx -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $fx | Out-Null
          $src = Get-Content -Raw automations/morning-brief.md
          $fm  = ($src -split '---\r?\n')[1]
          Set-Content -NoNewline -Path (Join-Path $fx 'morning-brief.md') `
            -Value "---`n$fm---`n`n`n   Indented first line.`nMiddle.`nTrailing spaces.   `n`n`n"
          Compare-Verb $fx 'brief'
          Remove-Item Env:MARGO_AUTOMATIONS -ErrorAction SilentlyContinue
          Write-Host "both wrappers agree on every prompt, byte for byte"

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every internal link and anchor resolves
        run: |
          python3 - <<'EOF'
          import re, pathlib, sys

          def slug(heading):
              # GitHub's rule: lowercase, drop everything that is not a word
              # character, whitespace or hyphen, then turn EACH whitespace
              # character into a hyphen — consecutive spaces are NOT collapsed.
              s = heading.strip().lower()
              s = re.sub(r'[^\w\s-]', '', s)
              return re.sub(r'\s', '-', s)

          bad = []
          for f in pathlib.Path('.').rglob('*.md'):
              if any(p in f.parts for p in ('.git', 'build', 'dist')):
                  continue
              for m in re.finditer(r'\]\(([^)]+)\)', f.read_text()):
                  raw = m.group(1).strip()
                  if raw.startswith(('http', 'mailto:')):
                      continue
                  path, _, frag = raw.partition('#')
                  target = (f.parent / path).resolve() if path else f.resolve()
                  if not target.exists():
                      bad.append(f"{f}: missing file -> {raw}")
                      continue
                  # Fragments were previously stripped and never checked, so a
                  # renamed heading left a dead anchor with CI green.
                  if frag and target.suffix == '.md':
                      heads = {slug(l.lstrip('#').strip())
                               for l in target.read_text().splitlines()
                               if l.startswith('#')}
                      if frag not in heads:
                          bad.append(f"{f}: dead anchor -> {raw}")
          if bad:
              for b in bad:
                  print(f"::error::{b}")
              sys.exit(1)
          print("all internal links and anchors resolve")
          EOF

  # Proves the installer works from a clean machine, on both platforms.
  install:
    name: Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Every assertion below checks CONTENT, never just that a filename exists.
      # A filename-only check passed while the user's data was gone.
      - name: Install, reinstall, status, uninstall
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/copilot"
          COS="$DEST/skills/chief-of-staff"

          plant() {
            echo "MY REAL PREFERENCES"  > "$COS/preferences.md"
            echo "MY RELATIONSHIP DATA" > "$COS/state/relationships.md"
            mkdir -p "$COS/state/one-on-ones"
            echo "MY 1:1 AGENDA"        > "$COS/state/one-on-ones/dana.md"
            echo '{"marker":"MYSTATEJSON"}' > "$COS/state/surfaced.json"
            # The classes the automations change added. Each of these was
            # destroyed by some path while CI stayed green.
            mkdir -p "$DEST/automations/nested"
            echo "MY OWN AUTOMATION"    > "$DEST/automations/mine.md"
            echo "MY NESTED FILE"       > "$DEST/automations/nested/deep.txt"
            echo "MY OWN TOOL"          > "$DEST/tools/mytool.sh"
            printf '# MY PATCHED WRAPPER\n' >> "$DEST/tools/margo-scheduled.sh"
          }
          # $1 = label. Fails unless every planted string is findable under $DEST.
          assert_all_survive() {
            for needle in "MY REAL PREFERENCES" "MY RELATIONSHIP DATA" "MY 1:1 AGENDA" "MYSTATEJSON" \
                          "MY OWN AUTOMATION" "MY NESTED FILE" "MY OWN TOOL" "MY PATCHED WRAPPER"; do
              grep -rqF "$needle" "$DEST" \
                || { echo "::error::$1 lost: $needle"; exit 1; }
            done
            echo "  ok: $1 preserved every class of personal data"
          }

          ./install.sh --all --dest "$DEST" --yes
          test -f "$DEST/agents/margo.agent.md"
          test -f "$COS/SKILL.md"

          # 0. The schedule must actually ship. docs/proactive.md told a fresh
          #    install to run ./tools/margo-scheduled.sh while the installer
          #    shipped no tools/ at all, so the documented setup was impossible.
          test -x "$DEST/tools/margo-scheduled.sh" \
            || { echo "::error::install did not ship an executable tools/margo-scheduled.sh"; exit 1; }
          test -f "$DEST/tools/margo-scheduled.ps1"
          test -f "$DEST/automations/morning-brief.md"
          n=$(find "$DEST/automations" -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          [ "$n" -ge 6 ] || { echo "::error::expected >=6 automations installed, found $n"; exit 1; }
          # And it must work from where it landed, not just from the checkout.
          ( cd "$RUNNER_TEMP" && "$DEST/tools/margo-scheduled.sh" brief --show-prompt ) \
            | grep -qi 'unattended' \
            || { echo "::error::installed wrapper cannot resolve its automations"; exit 1; }
          echo "  ok: automations and wrapper installed and self-sufficient"

          # 0b. A LINKED install must resolve automations too. It did not: the
          #     automations symlink was passed to find un-dereferenced, so every
          #     verb degraded to the free-form fallback and the 06:00 brief ran
          #     with the literal word "brief" as its entire prompt.
          LDEST="$RUNNER_TEMP/copilot-link"
          rm -rf "$LDEST"
          ./install.sh --all --dest "$LDEST" --link --yes
          rows=$("$LDEST/tools/margo-scheduled.sh" list 2>/dev/null | tail -n +2 | grep -c . || true)
          [ "$rows" -ge 6 ] \
            || { echo "::error::linked install lists $rows automations, expected >= 6"; exit 1; }
          "$LDEST/tools/margo-scheduled.sh" brief --show-prompt | grep -q 'chief-of-staff' \
            || { echo "::error::linked install sends the fallback, not the real prompt"; exit 1; }
          # A linked install must also be re-runnable.
          ./install.sh --all --dest "$LDEST" --link --yes \
            || { echo "::error::second linked install failed"; exit 1; }
          rm -rf "$LDEST"
          echo "  ok: linked install resolves automations and is re-runnable"

          # 1. Reinstall must not clobber anything the user owns.
          plant
          ./install.sh --all --dest "$DEST" --yes
          assert_all_survive "reinstall"

          # 2. --dry-run must change nothing. Directories included: a dry run
          #    allocated an empty margo-personal-backup.* and a files-only
          #    comparison could not see it.
          before=$(find "$DEST" | sort | md5sum)
          ./install.sh --all --dest "$DEST" --yes --dry-run >/dev/null
          after=$(find "$DEST" | sort | md5sum)
          [ "$before" = "$after" ] || { echo "::error::--dry-run modified the filesystem"; exit 1; }
          # The link path is where the stash allocator was reachable from a
          # message string, so exercise it too.
          before=$(find "$DEST" | sort | md5sum)
          ./install.sh --all --dest "$DEST" --link --yes --dry-run >/dev/null 2>&1 || true
          after=$(find "$DEST" | sort | md5sum)
          [ "$before" = "$after" ] || { echo "::error::--link --dry-run modified the filesystem"; exit 1; }
          echo "  ok: --dry-run wrote nothing, including directories"

          # 3. --link over a populated dir, non-interactive: must NOT destroy data.
          #    Before the fix this auto-confirmed and rm -rf'd with no backup.
          ./install.sh --link --dest "$DEST" < /dev/null || true
          assert_all_survive "--link non-interactive"
          test ! -L "$COS" || { echo "::error::--link replaced a real dir without consent"; exit 1; }

          # 4. --force must keep the original outside the install root.
          ./install.sh --all --dest "$DEST" --yes --force
          grep -rqF "MY REAL PREFERENCES" "$DEST" \
            || { echo "::error::--force destroyed the original"; exit 1; }
          echo "  ok: --force archived the original"

          ./install.sh status --dest "$DEST"

          # 5. Uninstall must archive every class, and by CONTENT.
          ./install.sh uninstall --dest "$DEST" --yes
          test ! -e "$DEST/agents/margo.agent.md"
          test ! -e "$DEST/automations" \
            || { echo "::error::uninstall left automations/ behind"; exit 1; }
          test ! -e "$DEST/tools/margo-scheduled.sh" \
            || { echo "::error::uninstall left the wrapper behind"; exit 1; }
          assert_all_survive "uninstall"

          # 6. A --dest that is (or contains) the checkout must be refused, not
          #    obeyed: link mode used to rm -rf the source and self-link it.
          if ./install.sh --link --dest "$PWD" --yes >/dev/null 2>&1; then
            echo "::error::--dest == source checkout was accepted"; exit 1
          fi
          if ./install.sh --dest "$PWD/inside" --yes >/dev/null 2>&1; then
            echo "::error::--dest inside the source checkout was accepted"; exit 1
          fi
          test -f install.sh && test -f skills/chief-of-staff/SKILL.md
          echo "  ok: overlapping --dest refused, checkout intact"

          # 7. Two archive-producing runs in the same second must not share a
          #    backup directory; the second used to overwrite the first.
          D2="$RUNNER_TEMP/collide"; rm -rf "$D2"
          ./install.sh --dest "$D2" --yes >/dev/null
          echo "FIRST ORIGINAL"  > "$D2/skills/chief-of-staff/preferences.md"
          ./install.sh --dest "$D2" --yes --force >/dev/null
          echo "SECOND ORIGINAL" > "$D2/skills/chief-of-staff/preferences.md"
          ./install.sh --dest "$D2" --yes --force >/dev/null
          for n in "FIRST ORIGINAL" "SECOND ORIGINAL"; do
            grep -rqF "$n" "$D2" || { echo "::error::backup collision lost: $n"; exit 1; }
          done
          echo "  ok: same-second archives did not collide"

          # 8. A failure archiving a LATER skill must leave everything in place.
          D3="$RUNNER_TEMP/partial"; rm -rf "$D3"
          ./install.sh --all --dest "$D3" --yes >/dev/null
          chmod 000 "$D3/skills/decision-log/config.md"
          ./install.sh uninstall --dest "$D3" --yes >/dev/null 2>&1 || true
          chmod 644 "$D3/skills/decision-log/config.md" 2>/dev/null || true
          for k in chief-of-staff decision-log; do
            test -d "$D3/skills/$k" \
              || { echo "::error::partial uninstall removed $k after reporting nothing was removed"; exit 1; }
          done
          echo "  ok: failed archive removed nothing"

          # 9. Version tracking and update.
          D4="$RUNNER_TEMP/upd"; rm -rf "$D4"
          ./install.sh --all --dest "$D4" --yes >/dev/null
          grep -q "^version=$(tr -d ' \t\n\r' < VERSION)$" "$D4/.margo-install" \
            || { echo "::error::install did not record the version"; exit 1; }
          echo "MY REAL PREFERENCES" > "$D4/skills/chief-of-staff/preferences.md"

          # Pretend we are behind, then check and update.
          sed -i.bak 's/^version=.*/version=0.0.1/' "$D4/.margo-install" && rm -f "$D4/.margo-install.bak"
          # Capture rather than pipe: grep -q closes the pipe early, which makes
          # the script's own printf report a broken pipe.
          out=$(./install.sh update --check --dest "$D4")
          printf '%s' "$out" | grep -q 'Update available' \
            || { echo "::error::update --check did not detect being behind"; exit 1; }
          # --check must not have changed anything.
          grep -q '^version=0.0.1$' "$D4/.margo-install" \
            || { echo "::error::update --check modified the install"; exit 1; }

          ./install.sh update --dest "$D4" >/dev/null
          grep -q "^version=$(tr -d ' \t\n\r' < VERSION)$" "$D4/.margo-install" \
            || { echo "::error::update did not record the new version"; exit 1; }
          grep -rqF "MY REAL PREFERENCES" "$D4" \
            || { echo "::error::update clobbered personal data"; exit 1; }
          # It must not have added skills the user never chose.
          grep -q '^skills=chief-of-staff decision-log$' "$D4/.margo-install" \
            || { echo "::error::update changed the installed skill set"; exit 1; }
          echo "  ok: version tracking and update correct"

          echo "install / reinstall / dry-run / link / force / uninstall / update all correct"

      - name: Install, reinstall, status, uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'copilot'
          $cos  = Join-Path $dest 'skills/chief-of-staff'

          function Plant {
            'MY REAL PREFERENCES'  | Set-Content "$cos/preferences.md"
            'MY RELATIONSHIP DATA' | Set-Content "$cos/state/relationships.md"
            New-Item -ItemType Directory -Path "$cos/state/one-on-ones" -Force | Out-Null
            'MY 1:1 AGENDA'        | Set-Content "$cos/state/one-on-ones/dana.md"
            '{"marker":"MYSTATEJSON"}' | Set-Content "$cos/state/surfaced.json"
            # The classes the automations change added. Each of these was
            # destroyed by some path while CI stayed green.
            New-Item -ItemType Directory -Path "$dest/automations/nested" -Force | Out-Null
            'MY OWN AUTOMATION' | Set-Content "$dest/automations/mine.md"
            'MY NESTED FILE'    | Set-Content "$dest/automations/nested/deep.txt"
            'MY OWN TOOL'       | Set-Content "$dest/tools/mytool.ps1"
            Add-Content "$dest/tools/margo-scheduled.ps1" -Value '# MY PATCHED WRAPPER'
          }
          # Checks CONTENT, never just that a filename exists.
          function AssertAllSurvive([string]$label) {
            foreach ($needle in @('MY REAL PREFERENCES','MY RELATIONSHIP DATA','MY 1:1 AGENDA','MYSTATEJSON',
                                  'MY OWN AUTOMATION','MY NESTED FILE','MY OWN TOOL','MY PATCHED WRAPPER')) {
              $hit = Get-ChildItem $dest -Recurse -File -Force -ErrorAction SilentlyContinue |
                     Select-String -SimpleMatch -Pattern $needle -List -ErrorAction SilentlyContinue
              if (-not $hit) { throw "$label lost: $needle" }
            }
            Write-Host "  ok: $label preserved every class of personal data"
          }

          ./install.ps1 install -All -Dest $dest -Yes
          if (-not (Test-Path "$dest/agents/margo.agent.md")) { throw "agent missing" }
          if (-not (Test-Path "$cos/SKILL.md")) { throw "skill missing" }

          # 0. The schedule must ship here too. This job asserted nothing about
          #    automations/ or tools/, so half of "both installers ship them"
          #    was verified on one installer.
          if (-not (Test-Path "$dest/tools/margo-scheduled.ps1")) { throw "wrapper not installed" }
          if (-not (Test-Path "$dest/tools/margo-scheduled.sh"))  { throw "shell wrapper not installed" }
          if (-not (Test-Path "$dest/automations/morning-brief.md")) { throw "automations not installed" }
          $n = @(Get-ChildItem "$dest/automations" -Filter *.md -File |
                 Where-Object { $_.Name -ne 'README.md' }).Count
          if ($n -lt 6) { throw "expected >= 6 automations installed, found $n" }
          # README.md must NOT ship: it points at files the installer excludes.
          if (Test-Path "$dest/automations/README.md") { throw "automations/README.md was installed" }
          # And the wrapper must resolve them from where it landed.
          Push-Location $env:RUNNER_TEMP
          $p = (& "$dest/tools/margo-scheduled.ps1" brief -ShowPrompt) -join "`n"
          Pop-Location
          if ($p -notmatch 'chief-of-staff') { throw "installed wrapper cannot resolve its automations" }
          Write-Host "  ok: automations and wrapper installed and self-sufficient"

          # 0b. A linked install must resolve automations AND be re-runnable.
          #     The second -Link run used to abort mid-install at exit 1.
          $ldest = Join-Path $env:RUNNER_TEMP 'copilot-link'
          Remove-Item -Recurse -Force $ldest -ErrorAction SilentlyContinue
          ./install.ps1 install -All -Dest $ldest -Link -Yes
          ./install.ps1 install -All -Dest $ldest -Link -Yes
          $lp = (& "$ldest/tools/margo-scheduled.ps1" brief -ShowPrompt) -join "`n"
          if ($lp -notmatch 'chief-of-staff') { throw "linked install sends the fallback, not the real prompt" }
          Remove-Item -Recurse -Force $ldest -ErrorAction SilentlyContinue
          Write-Host "  ok: linked install resolves automations and is re-runnable"

          # 1. Reinstall must not clobber anything the user owns.
          Plant
          ./install.ps1 install -All -Dest $dest -Yes
          AssertAllSurvive 'reinstall'

          # 2. -DryRun must change nothing.
          # Directories included: a dry run allocated an empty
          # margo-personal-backup.* and a files-only comparison could not see it.
          $snap = { (Get-ChildItem $dest -Recurse -Force | Sort-Object FullName | ForEach-Object FullName) -join "`n" }
          $before = & $snap
          ./install.ps1 install -All -Dest $dest -Yes -DryRun | Out-Null
          if ((& $snap) -ne $before) { throw "-DryRun modified the filesystem" }
          $before = & $snap
          ./install.ps1 install -All -Dest $dest -Link -Yes -DryRun 2>$null | Out-Null
          if ((& $snap) -ne $before) { throw "-Link -DryRun modified the filesystem" }
          Write-Host "  ok: -DryRun wrote nothing, including directories"

          # 3. -Link over a populated dir, non-interactive: must NOT destroy data.
          ./install.ps1 install -Link -Dest $dest 2>$null | Out-Null
          AssertAllSurvive '-Link non-interactive'

          # 4. -Force must keep the original outside the install root.
          ./install.ps1 install -All -Dest $dest -Yes -Force
          $orig = Get-ChildItem $dest -Recurse -File -Force |
                  Select-String -SimpleMatch -Pattern 'MY REAL PREFERENCES' -List
          if (-not $orig) { throw "-Force destroyed the original" }
          Write-Host "  ok: -Force archived the original"

          ./install.ps1 status -Dest $dest

          # 5. Uninstall must archive every class, and by CONTENT.
          ./install.ps1 uninstall -Dest $dest -Yes
          if (Test-Path "$dest/agents/margo.agent.md") { throw "agent not removed" }
          AssertAllSurvive 'uninstall'

          Write-Host "install / reinstall / dry-run / link / force / uninstall all correct"

      # The ledger's locking is platform-conditional: fcntl on POSIX, msvcrt on
      # Windows. The Linux job proves the no-locking fallback; only this proves
      # the msvcrt branch, on the one platform where msvcrt actually exists.
      - name: State ledger works on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python skills/chief-of-staff/scripts/proactive_state.py status
          python skills/chief-of-staff/scripts/proactive_state.py queue-add `
            --json '{"id":"mail:win","title":"windows locking check"}'
          $n = python skills/chief-of-staff/scripts/proactive_state.py queue-drain --format json |
               python -c "import json,sys;print(len(json.load(sys.stdin)))"
          if ([int]$n -lt 1) { throw "ledger did not round-trip an item on Windows" }
          Write-Host "ledger locks and round-trips correctly on Windows"

  # The macOS package builds on every PR, unsigned. Release signs it.
  package-macos:
    name: Build .pkg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Plant gitignored files before building. The packagers used to walk the
      # working tree, so .venv/, scratch *.local.md and the private denylist
      # shipped inside the installer. They are driven from git ls-files now.
      - name: Plant gitignored files the payload must not pick up
        run: |
          printf 'SecretName\n' > tools/forbidden.local.txt
          echo "scratch notes" > notes.local.md
          mkdir -p .venv && echo x > .venv/pyvenv.cfg

      - run: ./packaging/macos/build-pkg.sh 0.0.0-ci

      - name: Payload must contain only tracked files
        run: |
          if pkgutil --payload-files dist/Margo-0.0.0-ci.pkg \
               | grep -E 'forbidden\.local|\.local\.md|/\.venv/'; then
            echo "::error::installer payload contains gitignored working-tree files"
            exit 1
          fi
          rm -rf tools/forbidden.local.txt notes.local.md .venv
          echo "payload contains only tracked files"
      - name: Payload must not contain state or git metadata
        run: |
          pkgutil --payload-files dist/Margo-0.0.0-ci.pkg > /tmp/files.txt
          # Any runtime state, of any file type — the JSON-only guard this
          # replaces passed a payload containing real 1:1 agendas.
          leak=$(grep -E '/state/|/\.git/' /tmp/files.txt \
                 | grep -v '/state/\.gitignore$' \
                 | grep -v '/state/$' \
                 | grep -v '/\._' || true)
          if [ -n "$leak" ]; then
            echo "::error::package payload contains runtime state or git metadata"
            printf '%s\n' "$leak"
            exit 1
          fi
          echo "payload clean ($(wc -l < /tmp/files.txt) entries)"

  package-windows:
    name: Build .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: ./packaging/windows/build-exe.ps1 -Version 0.0.0
      - name: Silent install must work
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist/Margo-0.0.0-setup.exe'
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if (-not (Test-Path (Join-Path $HOME '.copilot/agents/margo.agent.md'))) {
            throw "silent install did not place the agent"
          }
          ./install.ps1 status
