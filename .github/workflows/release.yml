name: Release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- macOS ----
  macos:
    name: macOS .pkg
    runs-on: macos-latest
    env:
      CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      # Recorded so the release notes can tell users the truth about what they
      # are downloading. An unsigned .pkg is blocked by Gatekeeper on open, and
      # notes that say "just open it" strand every downloader.
      - name: Record signing state
        id: signed
        run: |
          if [ -n "$CERT" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"
          else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Resolve version
        id: v
        env:
          # Passed as data, never spliced into the script. `${{ }}` is substituted
          # into `run:` before the shell parses it, so a dispatch input written
          # inline would be executed rather than read — with the file-level
          # `contents: write` token in hand.
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Shape-check at the point of entry, so the value is already
            # constrained before it reaches the interpolated `run:` lines below
            # that build the .pkg name.
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version input must look like 1.2.3 (got: $INPUT_VERSION)"
              exit 1
            fi
            v="$INPUT_VERSION"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

          # The tag names the artifact; VERSION is what the installers stamp into
          # ~/.copilot/.margo-install and what `update --check` compares against.
          # If they disagree, we would ship Margo-<tag>.pkg whose manifest claims
          # a different version, and nobody would ever be told to update.
          file_v=$(tr -d ' \t\n\r' < VERSION)
          if [ "$v" != "$file_v" ]; then
            echo "::error::tag/input version ($v) does not match VERSION ($file_v)."
            echo "::error::Bump VERSION in the same commit you tag, then re-tag."
            exit 1
          fi
          echo "version $v matches VERSION" 

      # Signing is optional: without the secrets the build still produces a
      # working (unsigned) package, so forks and PRs are not blocked.
      - name: Import signing certificate
        if: env.CERT != ''
        env:
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v "$KEYCHAIN" | grep "Developer ID Installer"

      - name: Build package
        env:
          MARGO_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          MARGO_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MARGO_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MARGO_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: ./packaging/macos/build-pkg.sh "${{ steps.v.outputs.version }}"

      - name: Verify package
        run: |
          PKG="dist/Margo-${{ steps.v.outputs.version }}.pkg"
          test -f "$PKG" || { echo "::error::package not produced"; exit 1; }
          echo "### macOS package" >> "$GITHUB_STEP_SUMMARY"
          pkgutil --check-signature "$PKG" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          # The payload must never contain runtime state or git metadata —
          # any file type, not just *.json.
          leak=$(pkgutil --payload-files "$PKG" | grep -E '/state/|/\.git/' \
                 | grep -v '/state/\.gitignore$' \
                 | grep -v '/state/$' \
                 | grep -v '/\._' || true)
          if [ -n "$leak" ]; then
            echo "::error::package payload contains runtime state or git metadata"
            printf '%s\n' "$leak"
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: macos-pkg
          path: dist/*.pkg
          if-no-files-found: error

  # -------------------------------------------------------------- Windows ----
  windows:
    name: Windows .exe
    runs-on: windows-latest
    env:
      PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }

      - name: Record signing state
        id: signed
        shell: pwsh
        run: |
          $v = if ($env:PFX) { 'true' } else { 'false' }
          "signed=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Resolve version
        id: v
        shell: pwsh
        env:
          # Same reasoning as the macOS job: the input crosses into the script as
          # an environment variable, not as text substituted into `run:`.
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $v = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:INPUT_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
              Write-Host "::error::version input must look like 1.2.3 (got: $($env:INPUT_VERSION))"
              exit 1
            }
            $env:INPUT_VERSION
          } else {
            $env:GITHUB_REF_NAME -replace '^v', ''
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # Same guard as the macOS job: the tag names the artifact, VERSION is
          # what the installer stamps and what `update --check` compares against.
          $fileV = (Get-Content VERSION -Raw).Trim()
          if ($v -ne $fileV) {
            Write-Host "::error::tag/input version ($v) does not match VERSION ($fileV)."
            Write-Host "::error::Bump VERSION in the same commit you tag, then re-tag."
            exit 1
          }
          Write-Host "version $v matches VERSION"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Decode signing certificate
        if: env.PFX != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX))
          "MARGO_SIGN_PFX=$path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installer
        shell: pwsh
        env:
          MARGO_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./packaging/windows/build-exe.ps1 -Version '${{ steps.v.outputs.version }}'

      - name: Verify installer
        shell: pwsh
        run: |
          $exe = "dist/Margo-${{ steps.v.outputs.version }}-setup.exe"
          if (-not (Test-Path $exe)) { Write-Error "installer not produced"; exit 1 }
          $sig = Get-AuthenticodeSignature $exe
          "### Windows installer`n`n    signature: $($sig.Status)" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # A silent install on the runner proves the whole chain works: Inno
      # extracts, install.ps1 runs, and the files land in ~/.copilot.
      - name: Smoke test silent install
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/Margo-${{ steps.v.outputs.version }}-setup.exe"
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $agent = Join-Path $HOME '.copilot\agents\margo.agent.md'
          $skill = Join-Path $HOME '.copilot\skills\chief-of-staff\SKILL.md'
          if (-not (Test-Path $agent)) { Write-Error "agent not installed"; exit 1 }
          if (-not (Test-Path $skill)) { Write-Error "chief-of-staff not installed"; exit 1 }
          Write-Host "Installed successfully:"
          ./install.ps1 status

      - uses: actions/upload-artifact@v6
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

  # -------------------------------------------------------------- Release ----
  release:
    name: Publish release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with: { path: artifacts }

      - name: Collect and checksum
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.pkg' -o -name '*.exe' \) -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Built as a file rather than an inline `body:` so the unsigned warning can
      # be conditional. Signing secrets are optional, so a release can legitimately
      # ship either way — the notes must describe the artifact that was actually
      # produced, not the one we hope to produce later.
      - name: Compose release notes
        env:
          MAC_SIGNED: ${{ needs.macos.outputs.signed }}
          WIN_SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          {
            echo '## Install'
            echo
            echo '**macOS** — download `Margo-*.pkg` and open it.'
            echo '**Windows** — download `Margo-*-setup.exe` and run it. No admin rights needed.'
            echo

            if [ "$MAC_SIGNED" != "true" ] || [ "$WIN_SIGNED" != "true" ]; then
              echo '> [!IMPORTANT]'
              echo '> **These installers are unsigned.** Your OS will warn you, and the'
              echo '> warning is not a false alarm — it means the download is not'
              echo '> cryptographically attributable to anyone. Check `SHA256SUMS.txt`'
              echo '> against the build log before you bypass it.'
              echo '>'
              if [ "$MAC_SIGNED" != "true" ]; then
                echo '> **macOS** — a double-click is refused. Right-click the `.pkg` →'
                echo '> **Open** → **Open**, or allow it under **System Settings → Privacy'
                echo '> & Security**.'
                echo '>'
              fi
              if [ "$WIN_SIGNED" != "true" ]; then
                echo '> **Windows** — SmartScreen shows "Windows protected your PC". Choose'
                echo '> **More info** → **Run anyway**.'
              fi
              echo '>'
              echo '> The `curl`/`irm` commands below avoid this entirely: they fetch the'
              echo '> scripts over TLS from this repository rather than an unsigned binary.'
              echo
            fi

            echo 'Or from a terminal:'
            echo
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash'
            echo '```'
            echo '```powershell'
            echo 'irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex'
            echo '```'
            echo
            echo 'Upgrading is safe: `preferences.md`, `commitments.md`, `config.md` and'
            echo 'saved state are never overwritten.'
            echo
            echo 'Verify your download against `SHA256SUMS.txt`.'
          } > NOTES.md
          cat NOTES.md

      # Pinned to a commit, not a tag: this step runs under the file-level
      # `contents: write` and publishes the artifacts that SHA256SUMS.txt
      # describes. A moved tag would replace that code with no change here.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          body_path: NOTES.md
