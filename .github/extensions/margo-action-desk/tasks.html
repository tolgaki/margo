<header class="section-header page-header">
  <div class="topline"><h2>Tasks</h2><button id="refresh-runs" class="quiet" type="button">Refresh tasks</button></div>
  <p class="subtitle">Recorded steps, results and blockers.</p>
  <details class="page-status">
    <summary>Account &amp; journal health</summary>
    <div class="status-content"><strong id="account" class="meta">Current account: not yet verified</strong><p id="health-summary" class="meta">Task journal health: not yet checked</p><div id="health-detail"></div><button id="health" class="quiet" type="button">Refresh account and health</button></div>
  </details>
</header>
<div id="notice" class="notice" role="status" aria-live="polite" aria-atomic="true">Loading task runs...</div>
<div id="workspace" class="workspace" aria-busy="false" tabindex="-1">
  <section class="list-pane" aria-label="Task runs">
    <div class="list-tools"><h2 class="list-heading">Tracked tasks</h2><label for="task-query">Find in loaded tasks</label><input id="task-query" type="search" maxlength="300" placeholder="Search goals or routines"><nav id="views" class="view-tabs" aria-label="Task run views"></nav><p id="count" class="meta"></p></div>
    <div id="runs"></div>
    <div class="controls"><button id="more" type="button" hidden>Load next page</button></div>
  </section>
  <section id="detail" class="detail-pane" aria-label="Selected task run"><div class="empty"><strong>Select a task</strong><p>Read its steps, recorded results and limits.</p></div></section>
</div>
